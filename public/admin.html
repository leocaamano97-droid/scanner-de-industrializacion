<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración · Scanner de Industrialización</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  main{max-width:1150px;margin-top:20px}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{background:var(--azul);color:#fff;text-align:left;padding:7px 8px;position:sticky;top:0}
  table.t td{border-bottom:1px solid var(--borde);padding:7px 8px;vertical-align:top}
  .tabla{overflow:auto;max-height:70vh}
  .barra-adm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .barra-adm input{max-width:260px}
  .mini{padding:5px 10px;font-size:12.5px;border-radius:6px}
  .aviso{background:#FFF4E5;border:1px solid #F5C77E;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.kpis div{background:var(--fondo);border-radius:8px;padding:8px 14px}.kpis b{font-size:20px;color:var(--navy);display:block}
</style>
</head>
<body>
<header class="hero" style="padding:22px 16px 26px"><div class="hero-in"><div class="eyebrow">Scanner de Industrialización</div><h1 style="font-size:26px;margin:6px 0 0">Administración</h1></div></header>
<main>
  <div class="card" id="login">
    <h2>Ingresar</h2>
    <div class="fila"><input type="password" id="clave" placeholder="Clave de administración"><button class="btn" id="entrar">Entrar</button></div>
    <p class="msg err" id="lmsg"></p>
  </div>
  <div class="card" id="panel" hidden>
    <div id="aviso"></div>
    <div class="kpis" id="kpis"></div>
    <div class="barra-adm">
      <input type="text" id="filtro" placeholder="Buscar empresa o correo…">
      <a class="btn sec mini" id="csv" href="#">⬇ Descargar todas las respuestas (Excel/CSV)</a>
      <button class="btn sec mini" id="recargar">Actualizar</button>
    </div>
    <div class="tabla"><table class="t"><thead><tr><th>Fecha</th><th>Empresa</th><th>Correo</th><th>Región</th><th>Tamaño</th><th>Global</th><th>Correos enviados</th><th>Acciones</th></tr></thead><tbody id="filas"></tbody></table></div>
  </div>
</main>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); }, clave = '', datos = [];
  try { clave = sessionStorage.getItem('adm') || ''; } catch (e) {}
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function cargar() {
    fetch('/api/admin', { headers: { 'x-clave': clave } }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
      .then(function (j) {
        try { sessionStorage.setItem('adm', clave); } catch (e) {}
        $('#login').hidden = true; $('#panel').hidden = false; datos = j.respuestas;
        $('#aviso').innerHTML = j.correo ? '' : '<div class="aviso">El envío de correos aún no está configurado: las personas pueden descargar su informe, pero el botón de correo mostrará un error. Ver la guía, paso “Correo”.</div>';
        $('#csv').href = '/api/admin?formato=csv&clave=' + encodeURIComponent(clave);
        var conCorreo = datos.filter(function (d) { return d.envios > 0; }).length;
        $('#kpis').innerHTML = '<div><b>' + datos.length + '</b>respuestas</div><div><b>' + conCorreo + '</b>con informe enviado</div><div><b>' + (datos.length ? Math.round(datos.reduce(function (s, d) { return s + d.global; }, 0) / datos.length) : 0) + '%</b>promedio global</div>';
        pintar();
      }).catch(function (e) { $('#login').hidden = false; $('#panel').hidden = true; $('#lmsg').textContent = e.message; });
  }
  function pintar() {
    var f = $('#filtro').value.toLowerCase();
    $('#filas').innerHTML = datos.filter(function (d) { return !f || (d.empresa + ' ' + d.email).toLowerCase().indexOf(f) >= 0; }).map(function (d) {
      return '<tr><td>' + new Date(d.fecha).toLocaleString('es-CL') + '</td><td>' + esc(d.empresa) + '</td><td>' + esc(d.email) + '</td><td>' + esc(d.region) + '</td><td>' + esc(d.tamano) +
        '</td><td><b>' + d.global + '%</b> ' + d.nivel + '</td><td>' + d.envios + (d.ultimoError ? '<br><span class="down small" title="' + esc(d.ultimoError) + '">error en último intento</span>' : '') +
        '</td><td><a class="btn sec mini" href="/api/informe?id=' + d.id + '&admin=' + encodeURIComponent(clave) + '">PDF</a> <button class="btn mini" data-id="' + d.id + '" data-email="' + esc(d.email) + '">Enviar</button></td></tr>';
    }).join('') || '<tr><td colspan="8" class="muted">Sin respuestas todavía.</td></tr>';
  }
  $('#filas').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    var para = prompt('Enviar el informe a (separa varios correos con coma):', b.dataset.email || ''); if (!para) return;
    b.disabled = true; b.textContent = 'Enviando…';
    fetch('/api/enviar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: b.dataset.id, admin: clave, para: para }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
      .then(function () { alert('Informe enviado.'); cargar(); }).catch(function (e) { alert('No se pudo enviar: ' + e.message); b.disabled = false; b.textContent = 'Enviar'; });
  });
  $('#entrar').onclick = function () { clave = $('#clave').value; cargar(); };
  $('#clave').onkeydown = function (e) { if (e.key === 'Enter') $('#entrar').click(); };
  $('#filtro').oninput = pintar; $('#recargar').onclick = cargar;
  if (clave) cargar();
})();
</script>
</body>
</html>
